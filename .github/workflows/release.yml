name: Build & Release LocalDrop LAN

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

  build-and-release:
    name: Build Windows Executable & Installer
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Standalone Executable
        run: npm run build:exe

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows Installer
        shell: powershell
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } elseif (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc installer.iss
          } else {
            throw "Inno Setup compiler (ISCC.exe) not found"
          }
          if (!(Test-Path "dist\LocalDrop-LAN-Setup.exe")) {
            throw "Installer build failed: dist\LocalDrop-LAN-Setup.exe not found"
          }
          Compress-Archive -Path dist\LocalDrop-LAN-Setup.exe -DestinationPath dist\LocalDrop-LAN-Setup.zip -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localdrop-windows-build
          path: |
            LocalDrop-LAN.exe
            dist/LocalDrop-LAN-Setup.exe
            dist/LocalDrop-LAN-Setup.zip

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Update')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LocalDrop-LAN-Setup.exe
            dist/LocalDrop-LAN-Setup.zip
            LocalDrop-LAN.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.1' }}
          name: LocalDrop LAN ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.1' }}
          body: |
            ## LocalDrop LAN ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.1' }}
            
            ### What's New:
            - UI changes
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
